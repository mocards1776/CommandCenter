name: Times Telegram image alert

# Screenshots each new Thompson Times edition as four iPhone cards (front,
# weather, The Day Ahead, Best Games to Watch) at 430×932 CSS / 3x, and sends
# them on @ThompsonTimes_bot through times-telegram-shots. No repo
# secrets: the function trusts this workflow's GitHub OIDC token (repo + main
# branch + this file). The paper is opened read-only with a short-lived session
# the function mints and revokes. Day Ahead / watch photos are skipped when
# there is no schedule row or no games.
#
# times-telegram starts this workflow with workflow_dispatch as soon as an
# edition is ready (Supabase secret TIMES_TELEGRAM_GITHUB_TOKEN). The schedule
# below is only a backup; GitHub's schedule: cron in this repo is hours late
# and this workflow has sat at 0 runs. After a kick, times-telegram holds the
# text alert for 12 minutes; if the image alert has not gone out by then
# (dispatch failure, render error, timeout), the text alert goes instead.
on:
  schedule:
    # Backup only. Every 10 minutes around each press (6 a.m., noon, 5 p.m.
    # Central), in UTC for both CDT and CST.
    - cron: "2-59/10 10-13 * * *"
    - cron: "2-59/10 16-19 * * *"
    - cron: "2-59/10 21-23 * * *"
    - cron: "2-59/10 0 * * *"
  workflow_dispatch:
    inputs:
      issue_id:
        description: Edition id to screenshot (optional; otherwise the newest waiting edition)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: times-telegram-shots
  cancel-in-progress: false

jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CommandCenter-main/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stage runner
        run: |
          mkdir -p "$RUNNER_TEMP/times-shots"
          cp CommandCenter-main/scripts/times-shots.mjs "$RUNNER_TEMP/times-shots/"
      - name: Any edition waiting?
        id: peek
        working-directory: ${{ runner.temp }}/times-shots
        env:
          ISSUE_ID: ${{ github.event.inputs.issue_id }}
        run: |
          if [ -n "$ISSUE_ID" ]; then
            node times-shots.mjs --peek --issue "$ISSUE_ID"
          else
            node times-shots.mjs --peek
          fi
      - name: Install Chromium
        if: steps.peek.outputs.issue != ''
        working-directory: ${{ runner.temp }}/times-shots
        run: |
          npm init -y > /dev/null
          npm i --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Shoot and send
        if: steps.peek.outputs.issue != ''
        working-directory: ${{ runner.temp }}/times-shots
        env:
          ISSUE_ID: ${{ steps.peek.outputs.issue }}
        run: node times-shots.mjs --out shots --issue "$ISSUE_ID"

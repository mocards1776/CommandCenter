name: Install Times regenerated bundles
on:
  workflow_dispatch:
  push:
    branches: [fix/press-editor-trim]
    paths:
      - "docs/bundle-upload/**"
      - ".github/workflows/install-regenerated-bundles.yml"
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/press-editor-trim
      - name: Assemble and install bundles
        run: |
          set -euo pipefail
          cat docs/bundle-upload/compose-*.b64 | base64 -d > /tmp/compose.bundle.js
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          h = hashlib.sha256(Path("/tmp/compose.bundle.js").read_bytes()).hexdigest()
          print("compose sha256", h)
          assert h == "c2f05fa1e5ec8c7f0953f600dfd182c5fb58450cc16d4d60e766eb788d257827", h
          PY
          mkdir -p supabase/functions/newspaper-press supabase/functions/times-telegram
          mkdir -p CommandCenter-main/supabase/functions/newspaper-press CommandCenter-main/supabase/functions/times-telegram
          cp /tmp/compose.bundle.js supabase/functions/newspaper-press/compose.bundle.js
          cp /tmp/compose.bundle.js CommandCenter-main/supabase/functions/newspaper-press/compose.bundle.js
          cp docs/bundle-upload/front.bundle.js supabase/functions/times-telegram/front.bundle.js
          cp docs/bundle-upload/front.bundle.js CommandCenter-main/supabase/functions/times-telegram/front.bundle.js
          rm -rf docs/bundle-upload
          rm -f .github/workflows/install-regenerated-bundles.yml \
                .github/workflows/install-times-bundles.yml \
                .github/workflows/apply-times-lead-guard.yml || true
      - name: Commit
        run: |
          git config user.name "mocards1776"
          git config user.email "56750647+mocards1776@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nothing" && exit 0
          git commit -m "fix(times): regenerate compose/front bundles to match live (c2f05fa1)"
          git push

name: Deploy Supabase edge functions

# Frontend ships on Vercel when main updates. Edge (rss/sports/…) only updates
# when someone runs `supabase functions deploy`. This workflow closes that gap.
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "CommandCenter-main/supabase/functions/**"
      - ".github/workflows/deploy-edge.yml"
      - "scripts/sync-edge-copies.sh"
  workflow_dispatch:

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require edge copies to match
        run: |
          if ! diff -rq supabase/functions CommandCenter-main/supabase/functions; then
            echo "::error::Edge function copies drifted. Run: bash scripts/sync-edge-copies.sh && commit."
            exit 1
          fi
          echo "Edge copies in sync."

  deploy:
    needs: sync-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN secret is not set — skipping edge deploy."
            echo "Add it under Repo Settings → Secrets so edge functions ship automatically with main."
            exit 0
          fi
          REF="${PROJECT_REF:-esdgrgulaxnewmhjuyzh}"
          for fn in rss sports backfill-covers book-ai book-lookup todoist readwise-sync story-link plaid; do
            if [ -d "supabase/functions/$fn" ]; then
              echo "Deploying $fn…"
              if [ "$fn" = "rss" ] || [ "$fn" = "sports" ] || [ "$fn" = "story-link" ]; then
                supabase functions deploy "$fn" --project-ref "$REF" --no-verify-jwt
              else
                supabase functions deploy "$fn" --project-ref "$REF"
              fi
            fi
          done
          echo "Edge deploy complete for $REF"

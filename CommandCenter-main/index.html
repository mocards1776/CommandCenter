<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>🇺🇸 Josh's Command Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Playfair Display: high-contrast, engraved, for display and numerals.
         Libre Franklin: a modern cut of Franklin Gothic, for UI text. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Libre+Franklin:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#081228" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Command" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Reading Home Screen uses ?solo=1. Persist before React auth redirects
      // can strip the query, and send bare "/" to the library when preferred.
      (function () {
        try {
          if (/[?&]solo=1(?:&|$)/.test(location.search)) {
            localStorage.setItem("reading-solo", "1");
            sessionStorage.setItem("reading-solo", "1");
          }
          var path = location.pathname;
          if (
            (path === "/" || path === "") &&
            localStorage.getItem("reading-solo") === "1"
          ) {
            location.replace("/reading?solo=1");
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

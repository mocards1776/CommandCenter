<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>🇺🇸 Josh's Command Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Playfair Display: high-contrast, engraved, for display and numerals.
         Libre Franklin: a modern cut of Franklin Gothic, for UI text.
         Oswald: condensed sports mast for Thompson Times.
         Source Serif 4: readable article body for Dispatch. -->
    <link
      href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,700&family=Libre+Franklin:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#081228" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Command" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" href="/icon-192.png" />
    <script>
      // Shared Telegram Mini App bootstrap (Times "Read the paper", heat Open game,
      // finals RUWT board). Load the official script only inside Telegram's
      // WebView, then ready() + expand() so the sheet is full height.
      // Query params such as ?solo=1 stay on the URL; Telegram uses the hash.
      // Normal browsers never load the script.
      (function () {
        try {
          var inTelegram =
            /(?:^|[#&])tgWebApp(?:Data|Platform|Version)=/.test(location.hash) ||
            typeof window.TelegramWebviewProxy !== "undefined";
          if (!inTelegram) return;
          var s = document.createElement("script");
          s.src = "https://telegram.org/js/telegram-web-app.js";
          s.setAttribute("data-telegram-web-app", "1");
          s.onload = function () {
            var app = window.Telegram && window.Telegram.WebApp;
            if (!app) return;
            document.documentElement.classList.add("telegram-mini-app");
            app.ready();
            app.expand();
          };
          document.head.appendChild(s);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Standalone Home Screen apps launch with ?solo=1. Persist the flag before
      // React auth redirects can strip the query, and send bare "/" back to
      // whichever section the icon belongs to.
      (function () {
        var SOLO = [
          ["/reading", "reading-solo"],
          ["/sports", "sports-solo"],
          ["/rss", "rss-solo"],
          ["/newspaper", "newspaper-solo"],
        ];
        try {
          var path = location.pathname;
          if (/[?&]solo=1(?:&|$)/.test(location.search)) {
            for (var i = 0; i < SOLO.length; i++) {
              if (path.indexOf(SOLO[i][0]) === 0) {
                localStorage.setItem(SOLO[i][1], "1");
                sessionStorage.setItem(SOLO[i][1], "1");
                break;
              }
            }
          }
          if (path === "/" || path === "") {
            for (var j = 0; j < SOLO.length; j++) {
              if (localStorage.getItem(SOLO[j][1]) === "1") {
                var dest =
                  SOLO[j][1] === "sports-solo" ? "/sports/ruwt?solo=1" : SOLO[j][0] + "?solo=1";
                location.replace(dest);
                return;
              }
            }
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

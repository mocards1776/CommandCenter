<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MLB</title>
    <!--
      Static launch page for iOS “Add to Home Screen”.
      Safari bookmarks the URL of the page you’re on — it won’t let you edit it.
      Open THIS file, then Add. Do not add from /dashboard.
    -->
    <link rel="manifest" href="/mlb.webmanifest" />
    <meta name="theme-color" content="#081228" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MLB" />
    <link rel="apple-touch-icon" href="/icon-mlb-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-mlb-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-mlb-512.png" />
    <link rel="icon" href="/icon-mlb-192.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a1730;
        color: #f4f1e9;
        font-family: "Libre Franklin", system-ui, sans-serif;
        padding: 1.5rem;
      }
      .card {
        max-width: 22rem;
        text-align: center;
      }
      h1 {
        font-family: "Playfair Display", Georgia, serif;
        font-size: 2rem;
        font-weight: 700;
        color: #d9515c;
        margin: 0 0 0.75rem;
        letter-spacing: 0.04em;
      }
      p {
        margin: 0 0 0.85rem;
        font-size: 0.9rem;
        line-height: 1.45;
        color: rgba(244, 241, 233, 0.72);
      }
      strong {
        color: #f4f1e9;
      }
      .url {
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        color: rgba(244, 241, 233, 0.45);
        word-break: break-all;
      }
      a.btn {
        display: inline-block;
        margin-top: 0.75rem;
        padding: 0.7rem 1.25rem;
        border-radius: 2px;
        background: linear-gradient(#b3252f, #8e1e26);
        color: #f4f1e9;
        text-decoration: none;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
    </style>
    <script>
      (function () {
        try {
          localStorage.setItem("sports-solo", "1");
          sessionStorage.setItem("sports-solo", "1");
          localStorage.removeItem("reading-solo");
          sessionStorage.removeItem("reading-solo");
        } catch (e) {}
        var standalone =
          (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
          window.navigator.standalone === true;
        if (standalone) {
          location.replace("/sports/mlb?solo=1");
        }
      })();
    </script>
  </head>
  <body>
    <div class="card">
      <h1>MLB</h1>
      <p>
        Tap <strong>Share</strong>, then <strong>Add to Home Screen</strong>.
        The name should say MLB — leave it.
      </p>
      <p class="url" id="url"></p>
      <p>If the URL still says /dashboard, you’re on the wrong page. Stay here.</p>
      <a class="btn" href="/sports/mlb?solo=1">Open MLB</a>
    </div>
    <script>
      document.getElementById("url").textContent = location.href;
    </script>
  </body>
</html>

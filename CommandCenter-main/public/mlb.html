<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sports</title>
    <!-- Alias → full Sports standalone app. Prefer /sports.html for new installs. -->
    <link rel="manifest" href="/sports.webmanifest" />
    <meta name="theme-color" content="#081228" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sports" />
    <link rel="apple-touch-icon" href="/icon-mlb-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-mlb-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-mlb-512.png" />
    <link rel="icon" href="/icon-mlb-192.png" />
    <script>
      (function () {
        try {
          localStorage.setItem("sports-solo", "1");
          sessionStorage.setItem("sports-solo", "1");
          localStorage.removeItem("reading-solo");
          sessionStorage.removeItem("reading-solo");
        } catch (e) {}
        var standalone =
          (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
          window.navigator.standalone === true;
        location.replace(standalone ? "/sports?solo=1" : "/sports.html");
      })();
    </script>
  </head>
  <body style="background:#0a1730;color:#f4f1e9;font-family:system-ui;padding:2rem;text-align:center">
    <p>Opening Sports…</p>
    <p><a href="/sports.html" style="color:#d9515c">Continue</a></p>
  </body>
</html>
